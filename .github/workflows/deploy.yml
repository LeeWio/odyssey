name: Odyssey Frontend Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "contracts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/release.yml"
      - ".gitignore"

concurrency:
  group: odyssey-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 1. Setup Node/Bun and install dependencies with native cache
      - name: Setup Project Environment
        uses: ./.github/actions/setup-project

      # 2. Match local `preflight` gates so type-broken or failing unit tests never ship
      - name: Verify Code Quality
        run: bun run preflight

      # 3. Restore Next.js cache and compile standalone build on the host runner
      - name: Cache Next.js Build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Compile Next.js Standalone Application
        run: bun run build

      # 4. Set up Docker Buildx and login to GHCR
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # 5. Pack prebuilt standalone files into the ultra-lean runner-prebuilt target stage (takes ~5s)
      - name: Package Prebuilt Output & Push Image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-prebuilt
          push: true
          # Aliyun's personal registry rejects Buildx attestation manifests.
          # Publish signed provenance and SBOM against the same digest in GHCR.
          provenance: false
          sbom: false
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/leewio/odyssey-web:latest
            ghcr.io/leewio/odyssey-web:${{ github.sha }}
            crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com/wei_li/odyssey_web:latest
            crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com/wei_li/odyssey_web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/leewio/odyssey-web@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: odyssey-web.spdx.json
          artifact-name: odyssey-web.spdx.json
          syft-version: v1.43.0
          upload-release-assets: false

      - name: Publish Signed Image Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/leewio/odyssey-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish Signed Image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/leewio/odyssey-web
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: odyssey-web.spdx.json
          push-to-registry: true
          create-storage-record: false

  deploy-to-server:
    name: Pull & Recreate Container on Server
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://easylove.top
    steps:
      - name: Checkout Deployment Script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: HEALTHCHECK_URL,ALIYUN_REGISTRY,ALIYUN_REGISTRY_USER,ALIYUN_REGISTRY_PASSWORD,ALIYUN_IMAGE,WEB_LATEST_IMAGE,EXPECTED_IMAGE_DIGEST,EXPECTED_REVISION,SERVER_PROJECT_PATH
          command_timeout: 15m
          script_path: scripts/deploy-web.sh
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL || 'https://easylove.top/healthz/odyssey' }}
          ALIYUN_REGISTRY: crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ALIYUN_IMAGE: crpi-jljp0dhu73tl5aot.cn-shenzhen.personal.cr.aliyuncs.com/wei_li/odyssey_web
          WEB_LATEST_IMAGE: ghcr.io/leewio/odyssey-web:latest
          EXPECTED_IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.image_digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH || '/srv/blog' }}
