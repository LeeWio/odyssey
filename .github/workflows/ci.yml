name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Run Preflight Checks
        run: bun run preflight

  browser-smoke:
    name: Browser Smoke Tests
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    concurrency:
      group: odyssey-browser-smoke-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        run: bun run test:e2e:smoke

      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-and-audit:
    name: Production Build & Web Vitals Audit
    runs-on: ubuntu-latest
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Cache Next.js Build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          # Vercel-recommended high-performance GHA cache key strategy
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Run Production Build
        run: bun run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json

      - name: Upload Lighthouse Reports Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() # Run even if assertions fail, allowing developers to download and inspect HTML reports
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  api-contract:
    name: OpenAPI Contract (versioned API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check API compatibility and report coverage
        env:
          OPENAPI_FILE: contracts/nexus-openapi.operations.json
        run: node scripts/check-openapi-contract.mjs --coverage
