name: "Setup project"
description: "Install the pinned Bun toolchain and restore its dependency cache"

inputs:
  bun-version:
    description: "Version of Bun to install"
    required: false
    default: "1.3.14"
  install-deps:
    description: "Whether to run bun install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun Cache Directory
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.bun-version }}-

    - name: Install Dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile
